<!doctype html><meta charset="UTF-8"><title>恢复断点实际验收</title><style>body{font:16px system-ui;max-width:960px;margin:30px auto}button,a{padding:12px;margin:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>恢复断点实际验收</h1><p>使用真实恢复 API，停在上传完成后，便于关闭标签页再从正式界面继续。</p><button id="resume">准备续传验收</button><button id="cancel">准备取消验收</button><button id="verify">核验恢复条目与图片</button><pre id="result">就绪</pre><a href="/#/world/project/a550e279-fc4a-4954-b29b-3fc0b0aa0ea1">打开测试世界</a><script type="module">
import {worldApi} from '/src/api/worldApi.ts';import{createWorldBackup,readWorldBackup,replaceWorldImages}from'/src/utils/worldBackup.ts';import{resolveWorldImport}from'/src/utils/worldTransfer.ts';
const result=document.querySelector('#result'),projectId='a550e279-fc4a-4954-b29b-3fc0b0aa0ea1';
async function file(mode){const bytes=new Uint8Array(await(await fetch(`./${mode}.zip`)).arrayBuffer());const backup=await readWorldBackup(bytes);const fingerprint=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');return {backup,fingerprint};}
async function start(mode){const {backup,fingerprint}=await file(mode);return {backup,job:await worldApi.startRestore({sourceProjectId:projectId,fingerprint,fileName:`${mode}.zip`,newProject:false,name:backup.project.name,defaultType:'',plainText:false,cardCount:backup.items.length,images:[...backup.images].map(([path,i])=>({name:path.split('/').pop(),size:i.bytes.length}))})};}
for(const mode of ['resume','cancel'])document.querySelector('#'+mode).onclick=async()=>{try{result.textContent='准备并上传真实图片…';let {backup,job}=await start(mode);for(const [path,image]of backup.images){if(job.images[path])continue;const name=path.split('/').pop();job=await worldApi.uploadRestoreImage(job.id,name,new File([image.bytes],name,{type:image.type}));}result.textContent=JSON.stringify({id:job.id,state:job.state,images:job.images,cardIds:job.plan.cardIds,cardsPresent:(await worldApi.getCards(projectId)).filter(c=>job.plan.cardIds.includes(c.id)).length},null,2);}catch(e){result.textContent=e.friendlyMessage||String(e)}};
document.querySelector('#verify').onclick=async()=>{try{let {backup,job}=await start('resume');const cards=await worldApi.getCardsBatch(projectId,job.plan.cardIds);const expected=resolveWorldImport(replaceWorldImages(backup.items,new Map(Object.entries(job.images))),job.plan.cardIds).payloads;const differences=cards.flatMap(c=>{const i=job.plan.cardIds.indexOf(c.id);const actual={...c,relations:c.outRelations.map(r=>({targetCardId:r.targetCardId,relationType:r.relationType}))};return Object.keys(expected[i]).filter(k=>JSON.stringify(actual[k])!==JSON.stringify(expected[i][k])).map(k=>c.title+':'+k)});const exported=await createWorldBackup(await worldApi.getProject(projectId),cards);const reread=await readWorldBackup(exported.bytes);const [imagePath,image]=[...reread.images][0];const hash=imagePath.split('/').pop().split('.')[0];const loaded=image.bytes;result.textContent=JSON.stringify({state:job.state,id:job.id,count:cards.length,differences,hashMatches:Object.keys(job.images)[0].includes(hash),imageBytes:loaded.length,cardIds:job.plan.cardIds,allCards:(await worldApi.getCards(projectId)).length},null,2);}catch(e){result.textContent=e.friendlyMessage||String(e)}};
</script>
