<!doctype html><html lang="zh"><meta charset="UTF-8"><title>完整备份验收</title><style>body{font:16px system-ui;max-width:1000px;margin:30px auto}button{padding:12px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:80px}</style><h1>完整备份验收</h1><button id="quota">读取配额</button><button id="check">核验已恢复世界</button><button id="export">再次打包真实数据</button><pre id="result">准备中</pre><div id="links"></div><label>备份数据（Base64）<textarea id="data" readonly></textarea></label><script type="module">
import {worldApi} from '/src/api/worldApi.ts';
import {createWorldBackup,readWorldBackup,replaceWorldImages,worldImageUrls} from '/src/utils/worldBackup.ts';
import {worldMarkdown,parseWorldText,resolveWorldImport} from '/src/utils/worldTransfer.ts';
const source=await (await fetch('./source.json')).json();
const result=document.querySelector('#result');let project,cards;
const expected=resolveWorldImport(parseWorldText(worldMarkdown(source.project,source.cards),'fixture.md'),source.cards.map(c=>c.id)).payloads;
const read=async()=>{const worlds=await worldApi.getProjects();project=worlds.filter(p=>p.name===source.project.name).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];if(!project)throw new Error('尚无恢复世界');const all=await worldApi.getCards(project.id);cards=(await worldApi.getCardsBatch(project.id,all.map(c=>c.id))).sort((a,b)=>a.title.localeCompare(b.title));};
document.querySelector('#quota').onclick=async()=>{try{result.textContent=JSON.stringify(await worldApi.getQuota(),null,2)}catch(e){result.textContent=String(e)}};
document.querySelector('#check').onclick=async()=>{try{await read();const urls=worldImageUrls(project,cards),replacement=new Map(urls.map(u=>[u,source.cards[0].galleryImages[0]]));const restored=replaceWorldImages(cards,replacement);const values=resolveWorldImport(parseWorldText(worldMarkdown(project,restored),'actual.md'),source.cards.map(c=>c.id)).payloads;const differences=values.flatMap((p,i)=>Object.keys(expected[i]).filter(k=>JSON.stringify(p[k])!==JSON.stringify(expected[i][k])).map(k=>`${i}:${k}`));result.textContent=JSON.stringify({id:project.id,isPublic:project.isPublic,nameMatches:project.name===source.project.name,descriptionMatches:project.description===source.project.description,count:cards.length,differences,images:urls,oldImageAddressRemaining:JSON.stringify(cards).includes('/original.png'),allReferencesNew:!JSON.stringify(cards).includes('d0000000-0000-4000-8000-'),firstCard:cards[0].id,locationCard:cards[1].id},null,2);const a=document.createElement('a');a.href=`/#/world/project/${project.id}/card/${cards[0].id}`;a.textContent='打开恢复条目';document.querySelector('#links').replaceChildren(a)}catch(e){result.textContent=String(e)}};
document.querySelector('#export').onclick=async()=>{try{await read();const packed=await createWorldBackup(project,cards,m=>result.textContent=m);const reread=await readWorldBackup(packed.bytes);let binary='';for(let i=0;i<packed.bytes.length;i+=32768)binary+=String.fromCharCode(...packed.bytes.subarray(i,i+32768));document.querySelector('#data').value=btoa(binary);result.textContent=JSON.stringify({actualExportBytes:packed.bytes.length,cards:reread.items.length,imageCount:reread.images.size,imageHashes:[...reread.images.keys()]},null,2)}catch(e){result.textContent=String(e)}};
result.textContent='核验就绪';
</script></html>
